{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card mt-5">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Register</h2>

        <form method="POST" novalidate>
          <div class="mb-3">
            <label for="reg-username" class="form-label">Username</label>
            <input type="text" class="form-control" id="reg-username" name="username" autocomplete="username" required>
          </div>

          <div class="mb-2">
            <label for="reg-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="reg-password" name="password"
                   autocomplete="new-password" required>
          </div>

          <!-- Strength Meter -->
          <div class="password-meter my-2" id="pw-meter" aria-hidden="false">
            <div class="meter-bar"></div>
            <div class="meter-bar"></div>
            <div class="meter-bar"></div>
            <div class="meter-bar"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <small class="text-muted">Password strength:</small>
            <small id="pw-label" class="fw-semibold">Very weak</small>
          </div>

          <!-- Confirm Password -->
          <div class="mb-2">
            <label for="reg-password-confirm" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="reg-password-confirm" name="password_confirm"
                   autocomplete="new-password" required aria-describedby="confirmHelp">
            <div id="confirmHelp" class="invalid-feedback" aria-live="polite"></div>
          </div>

          <!-- Recommendations -->
          <div class="mb-3">
            <small class="text-muted d-block mb-1">Recommendations:</small>
            <ul id="pw-suggestions" class="mb-0 ps-3 small"></ul>
          </div>

          <button id="register-submit" type="submit" class="btn btn-primary w-100" disabled>Register</button>
          <small class="form-text text-muted d-block mt-2">
            Tip: Use at least 12 characters and mix UPPER/lowercase, numbers, and symbols.
          </small>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const strengthRef = initPasswordStrength({
      inputId: 'reg-password',
      usernameId: 'reg-username',
      barsSelector: '#pw-meter',
      labelSelector: '#pw-label',
      listSelector: '#pw-suggestions',
      submitId: 'register-submit',
      minScore: 2
    });

    initConfirmPassword({
      passwordId: 'reg-password',
      confirmId: 'reg-password-confirm',
      messageSelector: '#confirmHelp',
      submitId: 'register-submit',
      strengthRef,
      minScore: 2
    });
  });
</script>
{% endblock %}
