{% extends "base.html" %}
{% block title %}Log In · Ethics Radar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card mt-4">
      <div class="card-body p-4 p-md-5">
        <h2 class="card-title mb-3">Welcome back</h2>
        <p class="text-muted mb-4">Log in to access your dashboard and track reports.</p>

        <form action="{{ url_for('login') }}" method="POST" novalidate>
          <div class="mb-3">
            <label for="loginUsername" class="form-label">Username</label>
            <input id="loginUsername" name="username" type="text" class="form-control"
                   autocomplete="username" required>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
              <label for="loginPassword" class="form-label mb-0">Password</label>
              <button type="button" class="btn btn-sm btn-link password-toggle p-0"
                      data-target="#loginPassword" aria-label="Toggle password visibility">
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
            <input id="loginPassword" name="password" type="password" class="form-control"
                   autocomplete="current-password" required>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Log in</button>
            <a class="btn btn-link" href="{{ url_for('forgot_password') }}">Forgot password?</a>
          </div>
        </form>

        <hr class="my-4">

        <!-- High-contrast hint in dark mode -->
        <p class="auth-hint mb-0">
          Don’t have an account?
          <a href="{{ url_for('register') }}">Create one</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
