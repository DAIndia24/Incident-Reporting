{% extends "base.html" %}
{% block title %}Set a New Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card mt-5">
      <div class="card-body">
        <h2 class="card-title text-center mb-3">Create a new password</h2>
        <p class="text-center text-muted mb-4">Account: <strong>{{ username }}</strong></p>

        <form method="POST" novalidate>
          <!-- New Password -->
          <div class="mb-2">
            <label for="new-password" class="form-label">New Password</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="new-password"
                name="password"
                autocomplete="new-password"
                required
              >
            </div>
          </div>

          <!-- Strength Meter -->
          <div class="password-meter my-2" id="rpw-meter" aria-hidden="false">
            <div class="meter-bar"></div>
            <div class="meter-bar"></div>
            <div class="meter-bar"></div>
            <div class="meter-bar"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <small class="text-muted">Password strength:</small>
            <small id="rpw-label" class="fw-semibold">Very weak</small>
          </div>

          <!-- Confirm -->
          <div class="mb-2">
            <label for="new-password-confirm" class="form-label">Confirm New Password</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="new-password-confirm"
                name="password_confirm"
                autocomplete="new-password"
                required
                aria-describedby="confirmHelp"
              >
            </div>
            <div id="confirmHelp" class="invalid-feedback" aria-live="polite"></div>
          </div>

          <button id="reset-submit" type="submit" class="btn btn-primary w-100" disabled>Update Password</button>
          <small class="form-text text-muted d-block mt-2">
            Tip: Use at least 12 characters and mix UPPER/lowercase, numbers, and symbols.
          </small>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Initialize strength & confirm (no username influence here) -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const strengthRef = initPasswordStrength({
      inputId: 'new-password',
      barsSelector: '#rpw-meter',
      labelSelector: '#rpw-label',
      listSelector: '#pw-suggestions',    // optional: omit if you don’t want recs here
      submitId: 'reset-submit',
      minScore: 2
    });

    initConfirmPassword({
      passwordId: 'new-password',
      confirmId: 'new-password-confirm',
      messageSelector: '#confirmHelp',
      submitId: 'reset-submit',
      strengthRef,
      minScore: 2
    });
  });
</script>
{% endblock %}
